# Every push to main builds Rift for Windows, macOS (Apple silicon + Intel) and Linux, plus the browser
# extension, and publishes them as the next GitHub release (vX.Y.Z, marked "latest").
# The version comes from git tags (scripts/next-version.py); asset names are a contract with
# rift-static/download.html (see AGENTS.md rule 10).
name: Release

on:
  push:
    branches: [main]
  # Run by hand (Actions → Release → Run workflow) to build only some platforms, e.g. "linux" while
  # fixing a Linux-only problem. Partial runs upload their build as workflow artifacts and publish nothing.
  workflow_dispatch:
    inputs:
      platforms:
        description: "all, or any of: windows macos linux extension (space separated)"
        default: all

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"
  QT_MODULES: ""

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unit tests that need no toolchain
        run: |
          bash scripts/test-core.sh
          python3 tests/test_next_version.py
      - id: v
        run: echo "version=$(python3 scripts/next-version.py)" >> "$GITHUB_OUTPUT"
      - run: echo "Next release is v${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  extension:
    needs: version
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'extension') }}
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node browser/test.mjs
      - run: node browser/build.mjs "$V"
      - name: Zip
        run: |
          mkdir -p out
          (cd dist/browser/chromium && zip -qr "$GITHUB_WORKSPACE/out/Rift-$V-browser-chromium.zip" .)
          (cd dist/browser/firefox && zip -qr "$GITHUB_WORKSPACE/out/Rift-$V-browser-firefox.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: out/* }

  windows:
    needs: version
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'windows') }}
    runs-on: windows-2022
    env:
      V: ${{ needs.version.outputs.version }}
      # Built vcpkg packages (boost, openssl, libtorrent, curl) are kept in an on-disk binary cache that
      # actions/cache saves between runs, so only the first run compiles them (~25 min); later runs restore
      # them in about a minute. vcpkg checks each package's ABI hash, so a stale entry is never used.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the vcpkg binary cache
        id: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          "rev=$(git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: vcpkg-restore
        with:
          path: vcpkg-bincache
          key: vcpkg-x64-windows-${{ steps.vcpkg.outputs.rev }}-
          restore-keys: vcpkg-x64-windows-
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: libtorrent + libcurl (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libtorrent curl[ssl] --triplet x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Name the cache after its contents, so it is saved again only when a package was rebuilt.
          $names = (Get-ChildItem vcpkg-bincache -Recurse -File | ForEach-Object Name | Sort-Object) -join ","
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $h = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($names))[0..7] | ForEach-Object { $_.ToString("x2") })
          "VCPKG_CACHE_KEY=vcpkg-x64-windows-${{ steps.vcpkg.outputs.rev }}-$h" >> $env:GITHUB_ENV
      # Saved right away (not at job end), so a later failing step doesn't throw the 25-minute build away.
      - uses: actions/cache/save@v4
        if: env.VCPKG_CACHE_KEY != steps.vcpkg-restore.outputs.cache-matched-key
        with:
          path: vcpkg-bincache
          key: ${{ env.VCPKG_CACHE_KEY }}
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFT_VERSION="$env:V" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Tests
        shell: pwsh
        run: |
          .\build\core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:QT_QPA_PLATFORM = "offscreen"
          .\build\rift_ui_harness.exe
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::UI harness reported QML problems (exit $LASTEXITCODE)" }
      - name: Deploy
        shell: pwsh
        run: |
          $d = "build\deploy"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item build\Rift.exe, build\rift-native-host.exe $d
          windeployqt --release --qmldir ui\qml --no-translations --no-system-d3d-compiler --no-opengl-sw "$d\Rift.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          windeployqt --release --no-translations "$d\rift-native-host.exe"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $d
          Copy-Item LICENSE $d\LICENSE.txt
          # Smoke test the deployed app: exit 4 = QML warnings (reported), anything else non-zero = broken.
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "$d\Rift.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -eq 4) { Write-Output "::warning::Smoke test reported QML warnings" }
          elseif ($p.ExitCode -ne 0) { Write-Output "::error::Smoke test failed with exit $($p.ExitCode)"; exit 1 }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$env:V" "/DSourceDir=$PWD\build\deploy" "/DOutputDir=$PWD\out" packaging\windows\rift.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Portable: same files plus portable.flag (settings and data live next to Rift.exe)
          $p = "build\portable\Rift"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item build\deploy\* $p -Recurse
          New-Item -ItemType File "$p\portable.flag" | Out-Null
          Compress-Archive -Path $p -DestinationPath "out\Rift-$env:V-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  macos:
    needs: version
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'macos') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      V: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: libtorrent (Homebrew)
        run: brew install libtorrent-rasterbar ninja
      - name: App icon
        run: |
          mkdir -p rift.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s design/brand/rift-icon-512.png --out rift.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 1024 ] && sips -z $d $d design/brand/rift-icon-512.png --out rift.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns rift.iconset -o packaging/macos/rift.icns
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFT_VERSION="$V" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build
      - name: Tests
        run: |
          ./build/core_tests
          set +e
          QT_QPA_PLATFORM=offscreen ./build/rift_ui_harness > harness.log 2>&1; rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::UI harness reported QML problems ($rc)"
            # Public annotations (logs need a sign-in): the most frequent distinct QML messages.
            grep -E 'qrc:|\.qml' harness.log | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort | uniq -c | sort -rn | head -9 | sed 's/^ */::warning::QML /' || true
          fi
      - name: Bundle
        run: |
          APP=build/Rift.app
          cp build/rift-native-host "$APP/Contents/MacOS/"
          macdeployqt "$APP" -qmldir=ui/qml -executable="$APP/Contents/MacOS/rift-native-host" -always-overwrite
          codesign --force --deep --sign - "$APP"
          set +e
          QT_QPA_PLATFORM=offscreen "$APP/Contents/MacOS/Rift" --smoke-test; rc=$?
          set -e
          if [ $rc -eq 4 ]; then echo "::warning::Smoke test reported QML warnings"; elif [ $rc -ne 0 ]; then echo "::error::Smoke test failed ($rc)"; exit 1; fi
      - name: Package
        run: |
          mkdir -p out dmg
          ditto -c -k --keepParent build/Rift.app "out/Rift-$V-macos-$ARCH.zip"
          cp -R build/Rift.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Rift $V" -srcfolder dmg -ov -format UDZO "out/Rift-$V-macos-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/*

  linux:
    needs: version
    if: ${{ !inputs.platforms || inputs.platforms == 'all' || contains(inputs.platforms, 'linux') }}
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libtorrent-rasterbar-dev libcurl4-openssl-dev \
            libboost-dev libssl-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libfuse2 rpm ruby ruby-dev file
          sudo gem install --no-document fpm
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFT_VERSION="$V" -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Tests
        run: |
          ./build/core_tests
          set +e
          QT_QPA_PLATFORM=offscreen ./build/rift_ui_harness > harness.log 2>&1; rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::UI harness reported QML problems ($rc)"
            # Public annotations (logs need a sign-in): the most frequent distinct QML messages.
            grep -E 'qrc:|\.qml' harness.log | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort | uniq -c | sort -rn | head -9 | sed 's/^ */::warning::QML /' || true
          fi
      - name: AppImage
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          # Rift only uses SQLite. Drop the other SQL drivers so linuxdeploy doesn't chase their client
          # libraries (libmimerapi, libmysqlclient, ...), which aren't installed and aren't needed.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name 'libqsql*.so' ! -name 'libqsqlite.so' -delete
          # offscreen is bundled too, so the smoke test (and headless use) works; wayland/xcb come from the plugin.
          export QML_SOURCES_PATHS=$PWD/ui/qml EXTRA_QT_MODULES="svg" EXTRA_PLATFORM_PLUGINS="libqoffscreen.so" \
                 LDAI_OUTPUT="Rift-$V-linux-x86_64.AppImage"
          set +e
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/rift-native-host \
            --desktop-file packaging/linux/rift.desktop --icon-file packaging/linux/rift.png --plugin qt --output appimage \
            > linuxdeploy.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            cat linuxdeploy.log
            grep -iE 'error|could not|cannot|failed|not found' linuxdeploy.log | tail -9 | sed 's/^/::error::linuxdeploy: /'
            exit 1
          fi
          # The appimage plugin names the file from LDAI_OUTPUT, but older builds ignore it: take whatever it made.
          img="Rift-$V-linux-x86_64.AppImage"
          if [ ! -f "$img" ]; then
            made=$(ls -t ./*.AppImage | grep -v linuxdeploy | head -n1)
            [ -n "$made" ] || { echo "::error::linuxdeploy produced no AppImage"; ls -la; exit 1; }
            mv "$made" "$img"
          fi
          chmod +x "$img"
          # Smoke test the extracted image (no FUSE needed). Exit 127 means a missing library or file: list them.
          rm -rf squashfs-root && ./"$img" --appimage-extract > /dev/null
          QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun --smoke-test > smoke.log 2>&1; rc=$?
          set -e
          cat smoke.log
          if [ $rc -eq 4 ]; then echo "::warning::Smoke test reported QML warnings"
          elif [ $rc -ne 0 ]; then
            tail -n 9 smoke.log | sed 's/^/::error::smoke: /'
            for f in squashfs-root/usr/bin/rift squashfs-root/usr/plugins/platforms/*.so; do
              [ -f "$f" ] && LD_LIBRARY_PATH=squashfs-root/usr/lib ldd "$f" | grep 'not found' | sed "s|^|::error::missing for $(basename "$f"): |"
            done
            echo "::error::Smoke test failed ($rc)"; exit 1
          fi
          mkdir -p out && mv "$img" out/
      - name: deb, rpm and tar.gz
        run: |
          # The deployed AppDir (Rift + bundled Qt) goes to /opt/rift; /usr/bin/rift is a launcher.
          rm -rf stage && mkdir -p stage/opt/rift stage/usr/bin stage/usr/share/applications stage/usr/share/icons/hicolor/512x512/apps stage/usr/share/metainfo
          cp -a AppDir/usr/. stage/opt/rift/
          rm -rf stage/opt/rift/share/applications stage/opt/rift/share/metainfo
          printf '#!/bin/sh\nexec /opt/rift/bin/rift "$@"\n' > stage/usr/bin/rift && chmod 755 stage/usr/bin/rift
          cp packaging/linux/rift.desktop stage/usr/share/applications/
          cp packaging/linux/rift.png stage/usr/share/icons/hicolor/512x512/apps/
          cp packaging/linux/app.rift.Rift.metainfo.xml stage/usr/share/metainfo/
          common=(-s dir -C stage -n rift -v "$V" --license MIT --url https://rift.solarquack.in -m "Rift <noreply@rift.solarquack.in>"
                  --description "Torrents and direct downloads in one fast, calm window" --category net)
          fpm "${common[@]}" -t deb -a amd64 -p "out/rift_${V}_amd64.deb" -d libc6 -d libgl1 -d libxkbcommon0 -d libfontconfig1 -d libxcb-cursor0 .
          fpm "${common[@]}" -t rpm -a x86_64 -p "out/rift-${V}.x86_64.rpm" .
          tar -C stage/opt -czf "out/Rift-$V-linux-x86_64.tar.gz" --transform 's,^rift,Rift-'"$V"',' rift
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: out/* }

  publish:
    needs: [version, extension, windows, macos, linux]
    if: ${{ !inputs.platforms || inputs.platforms == 'all' }}
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Check asset names (contract with rift-static/download.html)
        run: |
          cd artifacts
          for f in "Rift-$V-windows-x64-setup.exe" "Rift-$V-windows-x64-portable.zip" \
                   "Rift-$V-macos-arm64.dmg" "Rift-$V-macos-x64.dmg" "Rift-$V-macos-arm64.zip" "Rift-$V-macos-x64.zip" \
                   "Rift-$V-linux-x86_64.AppImage" "rift_${V}_amd64.deb" "rift-${V}.x86_64.rpm" "Rift-$V-linux-x86_64.tar.gz" \
                   "Rift-$V-browser-chromium.zip" "Rift-$V-browser-firefox.zip"; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          sha256sum * > SHA256SUMS
      - name: Publish v${{ env.V }}
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          {
            echo "## Rift $V"
            echo
            echo "| Platform | Download |"
            echo "|---|---|"
            echo "| Windows 10/11 (x64) | \`Rift-$V-windows-x64-setup.exe\` · portable \`.zip\` |"
            echo "| macOS 12+ Apple silicon | \`Rift-$V-macos-arm64.dmg\` |"
            echo "| macOS 12+ Intel | \`Rift-$V-macos-x64.dmg\` |"
            echo "| Linux x86_64 | \`.AppImage\` · \`.deb\` · \`.rpm\` · \`.tar.gz\` |"
            echo "| Browser extension | Chromium / Firefox \`.zip\` |"
            echo ""
            echo "**Browser extension:** in Rift, open Settings → Browser → Get extension (it downloads the right zip and shows the steps). Or by hand: unzip \`Rift-$V-browser-chromium.zip\` into a folder you keep, open \`chrome://extensions\`, turn on Developer mode and click Load unpacked. Firefox: \`about:debugging#/runtime/this-firefox\` → Load Temporary Add-on → pick \`Rift-$V-browser-firefox.zip\`."
            echo
            echo "The app is not code-signed yet: on Windows choose *More info → Run anyway*; on macOS right-click Rift → *Open* the first time."
            echo
            if [ -n "$prev" ]; then echo "### Changes since $prev"; git log --pretty='- %s' "$prev"..HEAD | head -n 60; fi
          } > notes.md
          gh release create "v$V" artifacts/* --target "$GITHUB_SHA" --title "Rift $V" --notes-file notes.md --latest
