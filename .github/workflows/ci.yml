# Fast checks for pull requests and branches other than main (main is covered by release.yml).
# Needs no libtorrent/libcurl: core tests, version script, extension, and the real QML UI on a mock controller.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Core, version script, extension
        run: |
          bash scripts/test-core.sh
          python3 tests/test_next_version.py
          node browser/test.mjs
      - name: System packages for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: UI harness (real QML, mock controller; fails on any QML warning)
        run: bash scripts/ui-harness.sh
