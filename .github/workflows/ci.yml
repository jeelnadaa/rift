# Fast checks for pull requests and branches other than main (main is covered by release.yml).
# Needs no libtorrent/libcurl: core tests, version script, extension, and the real QML UI on a mock controller.
name: CI

on:
  # Docs, the website and the launch video don't change the app: pushing only those runs nothing.
  pull_request:
    paths-ignore: ['**.md', 'rift-static/**', 'brag-output/**', 'wrangler.jsonc', '.github/workflows/release.yml']
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', 'rift-static/**', 'brag-output/**', 'wrangler.jsonc', '.github/workflows/release.yml']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Core, version script, extension
        run: |
          bash scripts/test-core.sh
          python3 tests/test_next_version.py
          node browser/test.mjs
      - name: System packages for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-ui
          max-size: 500M
      - name: UI harness (real QML, mock controller; fails on any QML warning)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: bash scripts/ui-harness.sh
